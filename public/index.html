or:var(--teal);display:grid;place-items:center;font-weight:700}.topright{display:flex;align-items:center;gap:14px}.content{max-width:1190px;padding:38px clamp(20px,4vw,56px) 64px;margin:auto}.hero{display:flex;justify-content:space-between;gap:25px;align-items:flex-end;margin-bottom:28px}.hero h1{font:800 clamp(28px,3.5vw,40px)/1.13 Manrope;margin:7px 0 8px;letter-spacing:-.04em}.hero p{margin:0;color:var(--muted);max-width:590px}.button{border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);padding:10px 14px;font-weight:700;box-shadow:0 2px 4px #18344208}.button:hover{transform:translateY(-1px);box-shadow:var(--shadow)}.button.primary{background:var(--teal);border-color:var(--teal);color:#fff}.button.gold{background:var(--gold);border-color:var(--gold);color:#22343b}.button.danger{color:var(--red)}.button.small{font-size:12px;padding:7px 10px}.button:disabled{opacity:.6;cursor:wait;transform:none}.grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(275px,.75fr);gap:20px;align-items:start}.panel{background:var(--white);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.panel-head{padding:19px 21px 15px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #edf0ed}.panel-head h2{font:700 16px Manrope;margin:0}.panel-head p{margin:3px 0 0;font-size:12px;color:var(--muted)}.week-controls{display:flex;align-items:center;gap:8px}.week-controls span{font-size:12px;font-weight:700;min-width:106px;text-align:center}.iconbtn{border:1px solid var(--line);background:#fff;border-radius:8px;width:30px;height:30px;color:var(--ink)}.agenda{padding:4px 21px 18px}.day{padding:17px 0 5px;border-bottom:1px solid #edf0ed}.day:last-child{border-bottom:0}.day-title{display:flex;align-items:center;gap:9px;margin-bottom:9px;font-size:12px;font-weight:700;color:#50636b}.day-title .date{color:var(--muted);font-weight:500}.event{display:grid;grid-template-columns:72px 1fr auto;gap:12px;padding:11px 12px;border-radius:10px;margin:5px 0;align-items:center}.event:hover{background:#f8faf8}.event.changed{background:#f4faf6;border:1px solid #dcece2}.event.cancelled .event-title{text-decoration:line-through;color:#809097}.time{font:600 11px 'DM Sans';color:var(--teal)}.event-title{font-weight:700;font-size:13px}.event-sub{font-size:11px;color:var(--muted);margin-top:2px}.badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:20px;font-size:10px;font-weight:700;white-space:nowrap;background:#eff2ef;color:#687982}.badge.confirmed{background:var(--teal-soft);color:var(--teal)}.badge.review{background:var(--gold-soft);color:#88590d}.badge.updated{background:#e9f1fb;color:#375d91}.badge.pending{background:var(--red-soft);color:var(--red)}.sidecol{display:grid;gap:15px}.stat-row{padding:18px 20px;display:flex;justify-content:space-between;align-items:center}.stat-row+.stat-row{border-top:1px solid #edf0ed}.stat-label{color:var(--muted);font-size:12px}.stat-num{font:800 24px Manrope}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:13px}.statbox{padding:14px;background:#f8faf8;border-radius:10px}.statbox .stat-num{font-size:21px}.statbox .stat-label{font-size:11px}.callout{background:#e9f2eb;border:1px solid #d6e6d9;padding:16px;border-radius:12px}.callout h3{font:700 13px Manrope;margin:0 0 5px}.callout p{margin:0;color:#5c7269;font-size:12px}.empty{color:var(--muted);padding:25px 10px;text-align:center;font-size:13px}.section{display:none}.section.active{display:block}.form-panel{padding:22px}.form-panel h2{font:700 19px Manrope;margin:0 0 6px}.form-panel .intro{margin:0 0 20px;color:var(--muted);font-size:13px}.field{margin:14px 0}.field label{display:block;font-size:12px;font-weight:700;margin:0 0 6px}.field input,.field select,.field textarea{width:100%;border:1px solid #ced8d3;border-radius:8px;padding:10px 11px;background:#fff;color:var(--ink)}.field textarea{min-height:140px;resize:vertical}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.samplebar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.samplechip{border:1px solid #dce4df;background:#f6f8f6;color:#40555a;border-radius:20px;padding:6px 10px;font-size:11px;font-weight:600}.samplechip:hover{border-color:var(--teal);color:var(--teal)}.notice{padding:11px 13px;border-radius:9px;font-size:12px;background:#f3f6f4;color:#596e70;margin:15px 0}.notice.warn{background:var(--gold-soft);color:#805a18}.notice.ok{background:var(--teal-soft);color:#286a58}.results{margin-top:20px}.result-card{border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:10px;padding:15px;margin:12px 0;background:white}.result-card.high{border-left-color:var(--red)}.result-title{display:flex;justify-content:space-between;gap:10px;font-weight:700}.diff{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:12px 0}.old{background:var(--red-soft);color:var(--red);padding:5px 9px;border-radius:6px;text-decoration:line-through;font-size:12px}.new{background:var(--teal-soft);color:var(--teal);padding:5px 9px;border-radius:6px;font-size:12px;font-weight:700}.quote{background:#f6f7f4;border-left:2px solid #b8c7bc;padding:9px 11px;color:#53646a;font-size:12px;margin:10px 0}.result-meta{font-size:11px;color:var(--muted)}.result-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.list{padding:8px 18px 18px}.listrow{padding:14px 3px;border-bottom:1px solid #edf0ed;display:flex;justify-content:space-between;gap:12px;align-items:center}.listrow:last-child{border-bottom:0}.listrow strong{display:block;font-size:13px}.listrow small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.setting-card{padding:20px}.setting-card h2{font:700 16px Manrope;margin:0 0 6px}.setting-card p{font-size:12px;color:var(--muted);margin:0 0 12px}.sourcecode{font:11px ui-monospace,monospace;color:#48636a;background:#f5f8f5;padding:9px 11px;border-radius:7px;overflow:auto;white-space:nowrap}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#17333b;color:white;padding:11px 16px;border-radius:10px;box-shadow:var(--shadow);font-size:13px;z-index:9;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}.footer{font-size:11px;color:#82918e;text-align:center;margin-top:27px}.mobilebrand{display:none}.empty-card{padding:28px;text-align:center;color:var(--muted)}
@media(max-width:920px){.app{grid-template-columns:72px 1fr}.side{padding:21px 10px;align-items:center}.brand{padding:0}.brand .brandtext,.nav .label,.side-note{display:none}.nav{width:100%}.nav button{justify-content:center;padding:12px 8px}.grid{grid-template-columns:1fr}.sidecol{grid-template-columns:1fr 1fr}.callout{grid-column:1/-1}.content{padding-top:28px}}

</style></head><body><div id="app"></div><div id="toast" class="toast" role="status"></div>
<script>
const SEED_EVENTS=[
{id:'e1',code:'ECO101',title:'Economics',date:'2026-10-05',start:'10:00',end:'11:30',room:'LH-3',status:'confirmed',source:'Programme timetable'},
{id:'e2',code:'STA102',title:'Statistics',date:'2026-10-05',start:'14:00',end:'15:30',room:'LH-1',status:'confirmed',source:'Programme timetable'},
{id:'e3',code:'WRT103',title:'Writing & Rhetoric',date:'2026-10-06',start:'10:00',end:'11:30',room:'AC-204',status:'confirmed',source:'Programme timetable'},
{id:'e4',code:'PHI104',title:'Ethics',date:'2026-10-06',start:'15:00',end:'16:30',room:'LH-2',status:'confirmed',source:'Programme timetable'},
{id:'e5',code:'DAT201',title:'Data Lab · elective',date:'2026-10-07',start:'11:00',end:'12:30',room:'LAB-2',status:'confirmed',source:'Programme timetable'},
{id:'e6',code:'ECO101',title:'Economics',date:'2026-10-08',start:'10:00',end:'11:30',room:'LH-3',status:'confirmed',source:'Programme timetable'},
{id:'e7',code:'STA102',title:'Statistics',date:'2026-10-08',start:'14:00',end:'15:30',room:'LH-1',status:'confirmed',source:'Programme timetable'},
{id:'e8',code:'PHI104',title:'Ethics',date:'2026-10-09',start:'11:00',end:'12:30',room:'LH-2',status:'confirmed',source:'Programme timetable'}];
const SAMPLES=[
{name:'Economics moved · approved',sender:'programme@ashoka.edu.in',received:'2026-10-04T18:10',text:"Dear fellows, due to a faculty clash, Thursday's Econ class is moved to 3 pm in LH-5. Please plan accordingly. Regards, Programme Office"},
{name:'Problem set deadline extended · approved',sender:'yif@ashoka.edu.in',received:'2026-10-03T21:30',text:'Hi all. Statistics problem set 3 deadline is extended to Monday 12 Oct, 11:59 pm. No further extensions.'},
{name:'Writing session cancelled · approved',sender:'programme@ashoka.edu.in',received:'2026-10-03T20:00',text:'Please note the Writing session on Tuesday is cancelled. A makeup slot will be shared soon.'},
{name:'Ethics tutorial · unverified sender',sender:'ta@someclub.org',received:'2026-10-02T16:45',text:'Reminder from the TA team: the Ethics tutorial next Friday is moved to 1 pm in LH-4.'},
{name:'Optional guest lecture · approved',sender:'programme@ashoka.edu.in',received:'2026-10-04T11:00',text:'Guest lecture on AI in Public Policy, Thursday 8 Oct at 5 pm in LH-1. Optional but recommended.'}
];
const KEY='yif-schedule-companion-v1';let state=load();let tab='week';let weekOffset=0;let apiMode='checking';
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'{}');return {events:x.events||structuredClone(SEED_EVENTS),changes:x.changes||[],actions:x.actions||[],lastSynced:x.lastSynced||'2026-10-04T09:00',source:'sample timetable'}}catch{return {events:structuredClone(SEED_EVENTS),changes:[],actions:[],lastSynced:'2026-10-04T09:00'}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{toast('Could not save locally. Your browser storage may be full.')}}
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function addDays(s,n){let d=new Date(s+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
function monday(s){let d=new Date(s+'T12:00:00Z'),n=(d.getUTCDay()+6)%7;return addDays(s,-n)}
function pretty(s,opt={weekday:'short',month:'short',day:'numeric'}){if(!s)return '';let [y,m,d]=s.slice(0,10).split('-').map(Number);return new Intl.DateTimeFormat('en-IN',{...opt,timeZone:'UTC'}).format(new Date(Date.UTC(y,m-1,d,12)))}
function toast(msg){let t=document.querySelector('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._timer);t._timer=setTimeout(()=>t.classList.remove('show'),2600)}
const navItems=[['week','⌂','This week'],['updates','↗','New update'],['away','◷','Catch up'],['settings','⚙','Settings']];
function shell(){return `<div class="app"><aside class="side"><div class="brand"><div class="brandmark">Y</div><div class="brandtext"><strong>YIF Companion</strong><small>Independent planning</small></div></div><nav class="nav" aria-label="Main navigation">${navItems.map(([id,ic,l])=>`<button class="${tab===id?'active':''}" data-tab="${id}" aria-current="${tab===id?'page':'false'}"><span class="ico">${ic}</span><span class="label">${l}</span></button>`).join('')}</nav><div class="side-note"><b>Built for clarity.</b><span>Every suggested change keeps its source, timestamp and review status in view.</span></div></aside><main class="main"><header class="topbar"><div><div class="eyebrow">YIF · schedule companion</div><div class="today">Your week, with the changes made clear.</div></div><div class="topright"><span class="today">Asia/Kolkata</span><div class="avatar" aria-label="Fellow">F</div></div></header><div class="content">${navItems.map(([id])=>`<section id="section-${id}" class="section ${tab===id?'active':''}"></section>`).join('')}<div class="footer">A personal coordination layer · Your schedule is saved in this browser on this device.</div></div></main></div>`}
function fillWeek(){let sec=document.querySelector('#section-week'),start=addDays('2026-10-05',weekOffset*7),end=addDays(start,7),events=state.events.filter(e=>e.date>=start&&e.date<end).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start)),review=state.changes.filter(c=>c.status==='review').length,updates=state.changes.length;
let days='';for(let i=0;i<7;i++){let d=addDays(start,i),list=events.filter(e=>e.date===d);if(!list.length&&i>4)continue;days+=`<div class="day"><div class="day-title">${pretty(d,{weekday:'long'})}<span class="date">${pretty(d)}</span></div>${list.length?list.map(e=>`<div class="event ${e.changed?'changed':''} ${e.cancelled?'cancelled':''}"><div class="time">${e.start||'—'}${e.end?'–'+e.end:''}</div><div><div class="event-title">${esc(e.code?e.code+' · ':'')}${esc(e.title)}</div><div class="event-sub">${esc(e.room||'Location to be confirmed')} · ${esc(e.source||'Programme timetable')}</div></div><span class="badge ${e.cancelled?'pending':e.status==='suggested'?'review':'confirmed'}">${e.cancelled?'Cancelled':e.status==='suggested'?'Suggested':'Confirmed'}${e.changed?' · Updated':''}</span></div>`).join(''):'<div class="empty" style="padding:9px">Nothing scheduled</div>'}</div>`}
sec.innerHTML=`<div class="hero"><div><div class="eyebrow">Your personal view</div><h1>This week, at a glance.</h1><p>See what’s confirmed, what changed, and where each detail came from.</p></div><button class="button primary" data-tab="updates">＋ Add an update</button></div><div class="grid"><section class="panel"><div class="panel-head"><div><h2>Your schedule</h2><p>Confirmed programme sessions and tracked changes</p></div><div class="week-controls"><button class="iconbtn" aria-label="Previous week" data-week="-1">‹</button><span>Week of ${pretty(start)}</span><button class="iconbtn" aria-label="Next week" data-week="1">›</button></div></div><div class="agenda">${days||'<div class="empty">No events this week yet. Import a timetable in Settings.</div>'}</div></section><aside class="sidecol"><section class="panel"><div class="panel-head"><div><h2>At a glance</h2><p>Only the items that need your attention</p></div></div><div class="stats"><div class="statbox"><div class="stat-num">${events.length}</div><div class="stat-label">scheduled items</div></div><div class="statbox"><div class="stat-num">${review}</div><div class="stat-label">need review</div></div><div class="statbox"><div class="stat-num">${updates}</div><div class="stat-label">updates received</div></div><div class="statbox"><div class="stat-num">${pretty((state.lastSynced||'').slice(0,10),{month:'short',day:'numeric'})}</div><div class="stat-label">timetable synced</div></div></div></section><div class="callout"><h3>Small changes, made clear.</h3><p>High-impact changes such as a time, deadline or cancellation stay in review until you confirm them.</p></div><section class="panel"><div class="panel-head"><div><h2>Recent changes</h2><p>Source-linked and reversible</p></div><button class="button small" data-tab="away">View all</button></div><div class="list">${state.changes.length?state.changes.slice().reverse().slice(0,3).map(c=>`<div class="listrow"><div><strong>${esc(c.title)}</strong><small>${esc(c.field)} · ${pretty(c.received.slice(0,10))}</small></div><span class="badge ${c.status==='review'?'review':c.status==='accepted'?'confirmed':'pending'}">${c.status==='review'?'Review':c.status==='accepted'?'Confirmed':'Dismissed'}</span></div>`).join(''):'<div class="empty">Your updates will appear here.</div>'}</div></section></aside></div>`}
function fillUpdates(){let sec=document.querySelector('#section-updates');let modeNote=apiMode==='on'?'<div class="notice ok">AI extraction is connected. It proposes facts only; dates and schedule changes are still checked in this app.</div>':apiMode==='off'?'<div class="notice warn">Demo extraction is active. Sample updates and common schedule wording work locally. Add an OpenAI API key to the Site runtime to enable structured AI extraction.</div>':'<div class="notice">Checking extraction availability…</div>';
sec.innerHTML=`<div class="hero"><div><div class="eyebrow">Update intake</div><h1>What changed?</h1><p>Paste a YIF message. We’ll compare it with your timetable and show the source beside the proposed change.</p></div></div><div class="grid"><section class="panel form-panel"><h2>Review an update</h2><p class="intro">Use a sample to see the workflow, or paste a message you received.</p>${modeNote}<div class="field"><label>Try a sample</label><div class="samplebar">${SAMPLES.map((s,i)=>`<button class="samplechip" data-sample="${i}">${esc(s.name)}</button>`).join('')}</div></div><div class="form-row"><div class="field"><label for="sender">Sender</label><select id="sender"><option value="programme@ashoka.edu.in">Programme Office · approved</option><option value="yif@ashoka.edu.in">Faculty · approved</option><option value="ta@someclub.org">TA / club · unverified</option><option value="other">Other · unverified</option></select></div><div class="field"><label for="received">Received (IST)</label><input id="received" type="datetime-local" value="2026-10-04T18:10"></div></div><div class="field"><label for="message">Update text</label><textarea id="message" maxlength="20000" placeholder="Paste the message here. Keep the original wording so dates can be interpreted in context."></textarea></div><button class="button primary" id="analyze">Find schedule changes&nbsp; →</button><div id="result" class="results"></div></section><aside class="sidecol"><div class="callout"><h3>What the app checks</h3><p>It matches course context, proposes a field-level change, and keeps ambiguous dates or unverified sources visible for your review.</p></div><section class="panel"><div class="panel-head"><div><h2>Source of truth</h2><p>Conflicts stay visible</p></div></div><div class="list"><div class="listrow"><div><strong>Programme timetable</strong><small>Highest authority</small></div><span class="badge confirmed">Primary</span></div><div class="listrow"><div><strong>Approved sender</strong><small>Programme or faculty domain</small></div><span class="badge">Trusted</span></div><div class="listrow"><div><strong>Other sender</strong><small>Review before changing a session</small></div><span class="badge review">Check</span></div></div></section><div class="notice">Your message is sent to the configured extraction service only when AI is enabled. It is not retained by this demo site.</div></aside></div>`}
function fillAway(){let sec=document.querySelector('#section-away'),items=state.changes.slice().reverse(),pending=items.filter(c=>c.status==='review'),handled=items.filter(c=>c.status!=='review');sec.innerHTML=`<div class="hero"><div><div class="eyebrow">Catch-up</div><h1>Since you were away.</h1><p>A short, source-linked list of what changed while you were doing other things.</p></div></div><section class="panel"><div class="panel-head"><div><h2>Needs your attention</h2><p>High-impact or uncertain changes remain unresolved until you decide.</p></div><span class="badge ${pending.length?'review':'confirmed'}">${pending.length} to review</span></div><div class="list">${pending.length?pending.map(changeHTML).join(''):'<div class="empty">Nothing waiting for your review.</div>'}</div></section><section class="panel" style="margin-top:17px"><div class="panel-head"><div><h2>Handled updates</h2><p>Confirmed or dismissed changes</p></div></div><div class="list">${handled.length?handled.map(changeHTML).join(''):'<div class="empty">Updates you confirm or dismiss will appear here.</div>'}</div></section>`}
function changeHTML(c){return `<article class="result-card ${c.risk==='high'?'high':''}"><div class="result-title"><span>${esc(c.title)}</span><span class="badge ${c.status==='review'?'review':c.status==='accepted'?'confirmed':'pending'}">${c.status==='review'?'Needs your review':c.status==='accepted'?'Confirmed':'Dismissed'}</span></div><div class="diff"><span class="badge">${esc(c.field)}</span><span class="old">${esc(c.oldValue||'No existing item')}</span><span aria-hidden="true">→</span><span class="new">${esc(c.newValue)}</span></div><div class="quote">“${esc(c.evidence)}”</div><div class="result-meta">From ${esc(c.sender)} · received ${esc(c.received.replace('T',' '))} IST · ${c.approved?'approved sender':'unverified sender'} · source preserved</div><div class="result-actions">${c.status==='review'?`<button class="button primary small" data-change="accept" data-id="${c.id}">Confirm change</button><button class="button small" data-change="dismiss" data-id="${c.id}">Dismiss</button>`:''}${c.status==='accepted'?`<button class="button small" data-change="undo" data-id="${c.id}">Undo</button>`:''}${c.status==='dismissed'?`<button class="button small" data-change="restore" data-id="${c.id}">Restore</button>`:''}</div></article>`}
function fillSettings(){let sec=document.querySelector('#section-settings');sec.innerHTML=`<div class="hero"><div><div class="eyebrow">Your controls</div><h1>Settings &amp; sources.</h1><p>Know what’s connected, what’s stored, and how to remove it.</p></div></div><div class="grid"><div style="display:grid;gap:15px"><section class="panel setting-card"><h2>Programme timetable</h2><p>Import a CSV with columns <code>kind,code,title,date,start,end,room</code>. Use <code>class</code> or <code>deadline</code> for kind. Importing replaces the current schedule.</p><div class="field"><label for="csv">Choose timetable CSV</label><input id="csv" type="file" accept=".csv,text/csv"></div><div class="sourcecode">Last synced: ${esc(state.lastSynced||'Not yet synced')} IST · ${esc(state.source||'Sample timetable')}</div></section><section class="panel setting-card"><h2>Calendar export</h2><p>Export confirmed schedule items as an .ics file. The app will not write to your calendar automatically.</p><button class="button" id="export">Download .ics</button></section><section class="panel setting-card"><h2>Local data</h2><p>This prototype stores your timetable and review actions in this browser on this device. Clear browser data to remove it, or reset the app below.</p><button class="button danger" id="reset">Delete local data</button></section></div><aside class="sidecol"><section class="panel setting-card"><h2>AI extraction</h2><p>OpenAI runs from the server side only if an API key is configured for this Site. The browser never receives the key. Otherwise, the app uses a lightweight local demo parser.</p><div class="sourcecode">${apiMode==='on'?'OpenAI structured extraction · connected':apiMode==='off'?'Demo parser · no key configured':'Checking status…'}</div><p style="margin-top:11px">No message history is stored by the extraction endpoint.</p></section><section class="panel setting-card"><h2>Authority &amp; trust</h2><p>Programme timetable → approved sender → unverified sender. High-risk changes such as time, deadline, cancellation or conflicts always need your confirmation.</p><div class="sourcecode">Timezone: Asia/Kolkata · Schedule stays in this browser</div></section><div class="notice warn">Prototype note: this Site does not connect to YIF mailboxes or a live calendar. Use consented sample messages for testing; verify data handling before any real pilot.</div></aside></div>`}
function render(){document.querySelector('#app').innerHTML=shell();fillWeek();fillUpdates();fillAway();fillSettings()}
function infer(text,received){let low=text.toLowerCase(),code=null;for(const [k,terms] of Object.entries({ECO101:['econ','economics'],STA102:['statistics','stats'],WRT103:['writing','rhetoric'],PHI104:['ethics'],DAT201:['data lab']})){if(terms.some(t=>low.includes(t))){code=k;break}}
let dphrase=(text.match(/\b\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\b|\b(?:Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday)(?:'s)?\b/i)||[])[0]||null,date=null,amb=false;
if(dphrase){let base=received?received.slice(0,10):'2026-10-04',m=dphrase.match(/(\d{1,2})\s+([A-Za-z]+)/);if(m){let mon=new Date(Date.parse(m[2]+' 1, 2026')).getMonth()+1;date='2026-'+String(mon).padStart(2,'0')+'-'+String(+m[1]).padStart(2,'0');}else{let names=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'],want=names.indexOf(dphrase.toLowerCase().replace(/'s$/,'')),cur=new Date(base+'T12:00:00Z').getUTCDay(),delta=(want-cur+7)%7;date=addDays(base,delta||7);if(/next\s/i.test(text)){amb=true}}}
let tm=text.match(/\b(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/i),time=null;if(tm){let h=+tm[1]%12;if(tm[3].toLowerCase()==='pm')h+=12;time=String(h).padStart(2,'0')+':'+(tm[2]||'00')}
let rm=text.match(/\b(?:LH|AC|SB|LAB)[\s-]?\d{1,3}\b/i),room=rm?rm[0].toUpperCase().replace(/\s/,'-').replace(/^([A-Z]+)(\d)/,'$1-$2'):null;
let type=/cancel/i.test(text)?'cancellation':/deadline|due|extended/i.test(text)?'deadline':code&&(time||room)?'reschedule':/guest lecture|workshop|webinar|talk/i.test(text)?'new event':'info';let ev=text.split(/(?<=[.!?])\s+/).find(s=>/cancel|moved|reschedul|due|deadline|extended|lecture|\d\s*(am|pm)/i.test(s))||text;return{type,code,date,time,room,amb,evidence:ev}}
function buildChanges(ex,text,received,sender){let approved=/@ashoka\.edu\.in$/i.test(sender),matches=state.events.filter(e=>ex.code&&e.code===ex.code&&!e.cancelled),target=ex.date?matches.find(e=>e.date===ex.date)||matches.sort((a,b)=>Math.abs(Date.parse(a.date)-Date.parse(ex.date))-Math.abs(Date.parse(b.date)-Date.parse(ex.date)))[0]:matches[0],out=[];let title=target?.title||(ex.type==='new event'?text.match(/(?:guest lecture|workshop|webinar|talk)\s+(?:on\s+)?([^,.]+)/i)?.[1]:'Programme update')||'Programme update';
if(ex.type==='cancellation'&&target)out.push({field:'Session status',oldValue:'Scheduled',newValue:'Cancelled',risk:'high',targetId:target.id,title,evidence:ex.evidence});
if(ex.type==='deadline'){let due=(text.match(/\b(?:Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday)\s+\d{1,2}\s+[A-Za-z]+\s*,?\s*\d{1,2}:\d{2}\s*(?:am|pm)/i)||[])[0]||ex.date||'Date needs review';out.push({field:'Deadline',oldValue:'Current deadline',newValue:due,risk:'high',targetId:null,title:text.match(/(?:problem set|assignment|essay)\s*\d*/i)?.[0]||'Deadline update',evidence:ex.evidence})}
if(ex.type==='reschedule'&&target){if(ex.time&&ex.time!==target.start)out.push({field:'Time',oldValue:target.start,newValue:ex.time,risk:'high',targetId:target.id,title});if(ex.room&&ex.room!==target.room)out.push({field:'Room',oldValue:target.room,newValue:ex.room,risk:'medium',targetId:target.id,title});if(ex.date&&ex.date!==target.date)out.push({field:'Date',oldValue:target.date,newValue:ex.date,risk:'high',targetId:target.id,title})}
if(ex.type==='new event'){out.push({field:'New event',oldValue:'Not on your schedule',newValue:[ex.date,ex.time,ex.room].filter(Boolean).join(' · ')||'Details need review',risk:'medium',targetId:null,title,evidence:ex.evidence})}
if(!out.length)out.push({field:'Update',oldValue:'No matching schedule item',newValue:'Open source and review',risk:'high',targetId:null,title,evidence:ex.evidence});
return out.map(c=>({...c,id:crypto.randomUUID(),status:!approved||ex.amb||c.risk==='high'?'review':'review',approved,sender,received,evidence:c.evidence||ex.evidence,ambiguous:!!ex.amb,sourceText:text,undo:null}))}
async function analyze(){let btn=document.querySelector('#analyze'),text=document.querySelector('#message').value.trim(),received=document.querySelector('#received').value,sender=document.querySelector('#sender').value;if(!text){toast('Choose a sample or paste a message first.');return}btn.disabled=true;btn.textContent='Reading the update…';let ex;try{let res=await fetch('/api/extract',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text,received,sender})});if(res.ok){let ai=await res.json(),local=infer(text,received);ex={...local,...ai,code:ai.course_code||local.code,time:ai.time_24h||local.time, evidence:ai.evidence_quote||local.evidence,date:local.date,ambiguous:local.ambiguous};apiMode=ex.mode==='openai'?'on':'off'}else{ex=infer(text,received);apiMode='off'}}catch{ex=infer(text,received);apiMode='off'}let changes=buildChanges(ex,text,received,sender);state.changes.push(...changes);save();tab='updates';render();let result=document.querySelector('#result');result.innerHTML=`<h2>What we found</h2><div class="notice ${ex.ambiguous?'warn':'ok'}">${ex.ambiguous?'Date phrase is ambiguous. Review the source before confirming.':`Extraction: ${ex.mode==='openai'?'AI proposal, source checked':'demo rules'} · ${ex.code?'Matched '+ex.code:'No course match'}`}</div>${changes.map(changeHTML).join('')}`;btn.disabled=false;btn.textContent='Find schedule changes  →';toast('Update compared with your timetable.');document.querySelector('#section-updates').classList.add('active');document.querySelector('#result').innerHTML=`<h2>What we found</h2><div class="notice ${ex.ambiguous?'warn':'ok'}">${ex.ambiguous?'Date phrase is ambiguous. Review the source before confirming.':`Extraction: ${ex.mode==='openai'?'AI proposal, source checked':'demo rules'} · ${ex.code?'Matched '+ex.code:'No course match'}`}</div>${changes.map(changeHTML).join('')}`}
function action(id,verb){let c=state.changes.find(x=>x.id===id);if(!c)return;if(verb==='accept'){c.status='accepted';let e=state.events.find(x=>x.id===c.targetId);if(e){c.undo={date:e.date,start:e.start,room:e.room,cancelled:e.cancelled};if(c.field==='Date')e.date=c.newValue;if(c.field==='Time')e.start=c.newValue;if(c.field==='Room')e.room=c.newValue;if(c.field==='Session status')e.cancelled=true;e.changed=true}else if(c.field==='New event'){let [date,start,room]=c.newValue.split(' · ');state.events.push({id:'added-'+c.id,code:'',title:c.title,date:date||c.received.slice(0,10),start:start||'',end:'',room:room||'To be confirmed',status:'suggested',source:'Forwarded update',changed:true})}}else if(verb==='dismiss')c.status='dismissed';else if(verb==='undo'){if(c.undo){let e=state.events.find(x=>x.id===c.targetId);if(e)Object.assign(e,c.undo,{changed:false})}else state.events=state.events.filter(e=>e.id!=='added-'+c.id);c.status='dismissed'}else if(verb==='restore')c.status='review';save();render();toast(verb==='accept'?'Change confirmed.':verb==='undo'?'Change undone.':verb==='dismiss'?'Update dismissed.':'Update restored.')}
function parseCSV(text){let lines=text.trim().split(/\r?\n/).map(x=>x.split(',').map(v=>v.trim()));if(!lines.length)return[];let hdr=lines.shift().map(x=>x.toLowerCase()),idx=k=>hdr.indexOf(k);for(let k of ['kind','code','title','date'])if(idx(k)<0)throw Error('CSV is missing required column: '+k);return lines.filter(r=>r.length>1).map((r,i)=>({id:'csv-'+i,code:r[idx('code')],title:r[idx('title')],date:r[idx('date')],start:r[idx('start')]||'',end:r[idx('end')]||'',room:r[idx('room')]||'',status:'confirmed',source:'Imported timetable'})).filter(e=>e.date&&e.title)}
function exportICS(){let rows=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//YIF Schedule Companion//EN'];for(let e of state.events.filter(x=>!x.cancelled)){let d=e.date.replaceAll('-',''),s=(e.start||'09:00').replace(':','')+'00',en=(e.end||e.start||'10:00').replace(':','')+'00';rows.push('BEGIN:VEVENT','UID:'+e.id+'@yif-schedule','DTSTART;TZID=Asia/Kolkata:'+d+'T'+s,'DTEND;TZID=Asia/Kolkata:'+d+'T'+en,'SUMMARY:'+e.title.replaceAll(',','\\,'),'LOCATION:'+(e.room||''),'END:VEVENT')}rows.push('END:VCALENDAR');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows.join('\r\n')],{type:'text/calendar'}));a.download='yif-schedule.ics';a.click();URL.revokeObjectURL(a.href)}
document.addEventListener('click',e=>{let t=e.target.closest('[data-tab]');if(t){tab=t.dataset.tab;render();return}let w=e.target.closest('[data-week]');if(w){weekOffset+=+w.dataset.week;render();return}let sm=e.target.closest('[data-sample]');if(sm){let s=SAMPLES[+sm.dataset.sample];document.querySelector('#message').value=s.text;document.querySelector('#sender').value=s.sender;document.querySelector('#received').value=s.received;return}let ch=e.target.closest('[data-change]');if(ch){action(ch.dataset.id,ch.dataset.change);return}if(e.target.id==='analyze'){analyze();return}if(e.target.id==='export'){exportICS();return}if(e.target.id==='reset'){if(confirm('Delete this browser’s YIF timetable and update history?')){localStorage.removeItem(KEY);state=load();render();toast('Local data deleted.')}return}});
document.addEventListener('change',async e=>{if(e.target.id==='csv'&&e.target.files[0]){try{let events=parseCSV(await e.target.files[0].text());if(!events.length)throw Error('No timetable rows found.');state.events=events;state.changes=[];state.lastSynced=new Date().toISOString().slice(0,16);state.source=e.target.files[0].name;save();render();toast('Timetable imported.')}catch(err){toast(err.message)}}});
render();fetch('/api/health').then(r=>r.json()).then(x=>{apiMode=x.llm?'on':'off';if(tab==='updates'||tab==='settings')render()}).catch(()=>{apiMode='off';if(tab==='updates'||tab==='settings')render()});
</script></body></html>
